
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expanding cards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card active" style="background-image: url('https://i.pinimg.com/736x/02/86/4f/02864f627f3a218e4dee8fcaa0ececd0.jpg')">
            <span class="label">Explore The World</span>
        </div>
        <div class="card active" style="background-image: url('https://i.pinimg.com/1200x/cc/48/05/cc4805345f95396e08a5a6947455df2a.jpg')">
            <span class="label">Les Montagnes d'été</span>
        </div>
        <div class="card active" style="background-image: url('https://i.pinimg.com/736x/25/b5/bf/25b5bf33770862120754811acf5eb3f0.jpg')">
            <span class="label">Turkey</span>
        </div>
        <div class="card active" style="background-image: url('https://i.pinimg.com/736x/96/92/23/969223960f3ef6d1fd3f39eaeabb038a.jpg')">
            <span class="label">Plage de reve</span>
        </div>
        <div class="card active" style="background-image: url('https://i.pinimg.com/1200x/d2/85/ec/d285ecb5de8dce57c5df569b15e791e9.jpg')">
            <span class="label">Maison de Reve et foyer</span>
        </div>
    </div>

    <Script src="script.js"></Script>
</body>
</html>
